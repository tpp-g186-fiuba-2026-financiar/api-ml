name: Reentrenamiento diario

on:
  schedule:
    # 20:00 UTC (17:00 ART) de lunes a viernes, despues del cierre de BYMA
    # y antes del paper trading (21:00 UTC).
    - cron: "0 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Entrenar LSTM
        run: python -m src.train

      - name: Entrenar XGBoost
        run: python -m src.train_xgb

      - name: Entrenar Transformer
        run: python -m src.train_transformer

      - name: Commitear los modelos que mejoraron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "Ningun candidato supero al modelo vigente -- no se promueve nada hoy."
          else
            git commit -m "chore: reentrena modelos de tendencia (cron diario) [skip ci]"
            git push
          fi
