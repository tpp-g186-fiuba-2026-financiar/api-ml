name: Reentrenar Transformer V2

# Reentrena el Transformer V2 (el "transformer" de la API) el primer dia de cada
# mes, con el gate por IC fuera de muestra (src/panel/gate.py): entrena dos veces
# en CPU (evaluacion y final), ~15-30 min. Solo commitea si el candidato pasa.
on:
  schedule:
    - cron: "0 22 1 * *"
  workflow_dispatch:

permissions:
  contents: write

# Los runners de GitHub no llegan al data-colector local (default de
# settings.py): se usa el deployado. El V2 siempre entrena con el collector.
env:
  DATA_COLLECTOR_URL: https://data-colector-k7h6.onrender.com

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reentrenar
        run: python -m src.panel.train_transformer_v2

      - name: Commitear el artefacto si se promovio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f models/transformer_v2.pt models/transformer_v2.pt.score.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "El candidato no paso el gate -- queda el modelo vigente."
          else
            git commit -m "chore: reentrena el Transformer V2 (cron mensual) [skip ci]"
            git pull --rebase
            git push
          fi
