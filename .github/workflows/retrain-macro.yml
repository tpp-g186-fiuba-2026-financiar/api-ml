name: Reentrenar modelo macro

# El modelo "macro" depende del regimen macro de Argentina (riesgo pais, dolar, tasas): entrenado
# una sola vez pierde calidad (ver notebooks/investigacion_macro/README.md). Se reentrena el
# primer dia habil de cada mes con las series que sirve el data-colector.
# Ojo: necesita que el data-colector desplegado tenga los endpoints /macro/argdatos/* y el
# arreglo de /interest-rate/ar/* (ver data-colector/ENDPOINTS.md).
on:
  schedule:
    - cron: "0 22 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reentrenar
        env:
          # Historicos y series macro salen del data-colector (settings.py trae su URL por default).
          DATA_SOURCE: collector
        # Si el candidato no supera el AUC minimo fuera de muestra, no se guarda el artefacto
        # (ver --min-auc en src/train_macro.py) y el paso siguiente no encuentra cambios.
        run: python -m src.train_macro

      - name: Commitear el artefacto actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/macro.pkl
          if git diff --cached --quiet; then
            echo "sin cambios en el modelo"
          else
            git commit -m "chore: reentrena el modelo macro [skip ci]"
            git push
          fi
