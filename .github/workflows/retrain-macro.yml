name: Reentrenar modelo macro

# Reentrena el modelo macro el primer dia de cada mes. Requiere el data-colector con /macro/*.
on:
  schedule:
    - cron: "0 22 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reentrenar
        env:
          DATA_SOURCE: collector
        run: python -m src.train_macro

      - name: Commitear el artefacto actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/macro.pkl
          if git diff --cached --quiet; then
            echo "sin cambios en el modelo"
          else
            git commit -m "chore: reentrena el modelo macro [skip ci]"
            git push
          fi
