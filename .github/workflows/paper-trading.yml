name: Paper trading diario

on:
  schedule:
    # 21:00 UTC (18:00 ART) de lunes a viernes, despues del cierre de BYMA.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Correr paper trading
        env:
          DATA_COLLECTOR_URL: ${{ secrets.DATA_COLLECTOR_URL }}
          MODAL_LSTM_URL: ${{ secrets.MODAL_LSTM_URL }}
          MODAL_XGBOOST_URL: ${{ secrets.MODAL_XGBOOST_URL }}
          MODAL_ARIMA_URL: ${{ secrets.MODAL_ARIMA_URL }}
        run: python -m src.paper_trading

      - name: Commitear el ledger actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/paper_trading_ledger.json
          if git diff --cached --quiet; then
            echo "sin cambios en el ledger"
          else
            git commit -m "chore: actualiza paper trading ledger [skip ci]"
            git push
          fi
