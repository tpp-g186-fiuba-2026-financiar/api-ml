name: Paper trading diario

on:
  schedule:
    # 21:00 UTC (18:00 ART) de lunes a viernes, despues del cierre de BYMA.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Correr paper trading
        env:
          # DATA_COLLECTOR_URL no se pisa: settings.py ya trae un default
          # (el data-colector deployado). Si el secret no esta seteado,
          # GitHub lo resuelve como "" y pydantic lo toma como valor
          # explicito en vez de usar el default -- por eso las URLs de
          # Modal solo se mandan si de verdad estan configuradas.
          MODAL_LSTM_URL: https://matimorales01--lstm-trend-model-main.modal.run
          MODAL_XGBOOST_URL: https://matimorales01--xgboost-trend-model-main.modal.run
          MODAL_ARIMA_URL: https://matimorales01--arima-model-main.modal.run
        run: python -m src.paper_trading --models lstm-modal xgboost-modal arima-modal

      - name: Commitear el ledger actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/paper_trading_ledger.json
          if git diff --cached --quiet; then
            echo "sin cambios en el ledger"
          else
            git commit -m "chore: actualiza paper trading ledger [skip ci]"
            git push
          fi
